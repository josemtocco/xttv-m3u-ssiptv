name: Atualizar M3U XTTV

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar M3U
        env:
          MAX_CATEGORY_PAGES: '200'
          CONCURRENCY: '4'
          FAILS_TO_REMOVE: '2'
          PAGE_TIMEOUT_MS: '60000'
          WAIT_CATEGORY_MS: '3500'
          WAIT_NEXT_MS: '1800'
        run: python gerar_m3u.py

      - name: Publicar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add lista.m3u canais.json
          git diff --cached --quiet || git commit -m 'Atualizar lista M3U XTTV'
          git push
