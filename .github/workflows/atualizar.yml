name: Atualizar M3U XTTV

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-m3u
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Gerar M3U
        env:
          VALIDATE_STREAMS: 'true'
          FAILS_TO_REMOVE: '2'
          MAX_PAGES: '250'
          MAX_STATIONS: '10000'
          HTTP_TIMEOUT: '15'
          STREAM_TIMEOUT: '12'
        run: python gerar_m3u.py

      - name: Publicar arquivos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lista.m3u canais.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração.'
          else
            git commit -m 'Atualizar lista M3U XTTV'
            git push
          fi
